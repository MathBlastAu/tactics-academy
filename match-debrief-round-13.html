<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Debrief · The Film Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#040609; --panel:#0A0E16; --panel-2:#0F1522; --line:#1C2537;
  --chalk:#F2F7F0; --muted:#9DBBA8;
  --gold:#FFC93C; --gold-deep:#E0A100;
  --us:#4FC3F7; --them:#FF6B6B; --win:#4ADE80;
  --pitch:#04060B; --pitch-line:#8FE3FF;
  --prob:#FF6B6B; --fix:#4ADE80;
  --display:'Bungee','Arial Black','Franklin Gothic Medium',sans-serif;
  --body:'Nunito','Trebuchet MS','Segoe UI',Verdana,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);
  background:
    radial-gradient(1100px 480px at 50% -140px, rgba(255,201,60,.08), transparent 60%),
    linear-gradient(rgba(120,170,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,170,255,.035) 1px, transparent 1px),
    var(--night);
  background-size:auto,46px 46px,46px 46px,auto;
  color:var(--chalk);min-height:100vh;line-height:1.5;
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:rgba(4,6,9,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crest{width:44px;height:44px;flex:none;border-radius:50%;background:radial-gradient(circle at 30% 30%,#17233E,#05070C);
  border:2px solid var(--gold);display:grid;place-items:center;font-size:22px;box-shadow:0 0 14px rgba(255,201,60,.35)}
.brand{line-height:1.05}
.brand .t{font-family:var(--display);font-size:15px;letter-spacing:.5px}
.brand .s{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
.score{margin-left:auto;font-family:var(--display);font-size:15px;color:var(--gold);white-space:nowrap;text-shadow:0 0 12px rgba(255,201,60,.35)}
.score i{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--body);font-weight:900}
.badgebtn{border:1px solid var(--line);background:var(--panel);color:var(--chalk);border-radius:12px;padding:8px 12px;font-weight:900;font-size:12px}
.badgebtn:hover{border-color:var(--gold)}

.wrap{max-width:940px;margin:0 auto;padding:26px 16px 90px}

/* hero */
.hero{text-align:center;padding:30px 8px 8px}
.hero .eyebrow{font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--us)}
.hero h1{font-family:var(--display);font-size:clamp(28px,6vw,50px);line-height:1.03;margin-top:6px;
  background:linear-gradient(180deg,#fff,#D4E4F7 55%,#8FA8CC);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(79,195,247,.15)}
.scoreline{display:inline-flex;align-items:center;gap:14px;margin-top:16px;border:1.5px solid var(--line);
  background:var(--panel);border-radius:16px;padding:12px 22px}
.scoreline .team{font-weight:900;font-size:14px;max-width:180px}
.scoreline .num{font-family:var(--display);font-size:30px}
.scoreline .num.us{color:var(--us)} .scoreline .num.them{color:var(--them)}
.scoreline .vs{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:1px}
.meta-date{margin-top:10px;font-size:12px;font-weight:900;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.coachnote{max-width:640px;margin:20px auto 0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:14px;padding:14px 18px;text-align:left;display:flex;gap:12px}
.coachnote .mi{font-size:22px;line-height:1}
.coachnote b{display:block;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.coachnote p{font-weight:800;font-size:14.5px}
.howto{max-width:640px;margin:14px auto 0;font-size:12.5px;font-weight:800;color:var(--muted)}

/* case card */
.case{position:relative;margin-top:34px;border-radius:18px;overflow:hidden;
  background:radial-gradient(460px 170px at 16% 0%, color-mix(in srgb, var(--cc,#3ED6FF) 13%, transparent), transparent 70%),var(--panel);
  border:1.5px solid color-mix(in srgb, var(--cc,#3ED6FF) 70%, transparent);
  box-shadow:0 0 26px color-mix(in srgb, var(--cc,#3ED6FF) 15%, transparent), inset 0 0 50px rgba(0,0,0,.55)}
.case::before{content:'';position:absolute;top:9px;right:9px;width:38px;height:38px;border-top:2.5px solid var(--cc,#3ED6FF);border-right:2.5px solid var(--cc,#3ED6FF);border-top-right-radius:10px;opacity:.9;pointer-events:none}
.case::after{content:'';position:absolute;bottom:9px;left:9px;width:38px;height:38px;border-bottom:2.5px solid var(--cc,#3ED6FF);border-left:2.5px solid var(--cc,#3ED6FF);border-bottom-left-radius:10px;opacity:.9;pointer-events:none}
.chead{padding:18px 20px 4px 24px}
.cchip{display:inline-block;font-weight:900;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#fff;
  background:rgba(0,0,0,.55);border:1.5px solid var(--cc,#3ED6FF);padding:6px 24px 6px 12px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);
  box-shadow:0 0 12px color-mix(in srgb, var(--cc,#3ED6FF) 30%, transparent)}
.chead h2{font-family:var(--display);font-size:clamp(18px,3.4vw,26px);font-style:italic;margin-top:10px;
  text-shadow:0 0 18px color-mix(in srgb, var(--cc,#3ED6FF) 45%, transparent)}
.momentchip{display:inline-flex;gap:8px;align-items:center;margin-top:10px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:12px;font-weight:900;color:var(--muted)}
.momentchip b{color:var(--cc,#3ED6FF)}
.cpts{position:absolute;top:16px;right:22px;font-family:var(--display);font-size:12px;color:var(--cc,#3ED6FF);
  border:1.5px solid var(--cc,#3ED6FF);border-radius:10px;padding:6px 11px;background:rgba(0,0,0,.45)}

/* step tabs */
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:5px;margin:16px 20px 14px;width:fit-content;max-width:calc(100% - 40px);flex-wrap:wrap}
.tab{border:none;background:transparent;color:var(--muted);font-weight:900;font-size:12.5px;padding:9px 15px;border-radius:999px;letter-spacing:.4px;display:inline-flex;gap:7px;align-items:center}
.tab.active{background:var(--cc,var(--gold));color:#05070C;box-shadow:0 0 14px color-mix(in srgb, var(--cc,var(--gold)) 45%, transparent)}
.tab:not(.active):hover{color:var(--chalk)}
.tab .tick{font-size:11px}
.cbody{padding:0 20px 22px}
.panelbox{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:16px;padding:16px}

/* board */
.replaybar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rec{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:12px;letter-spacing:1px}
.rec .dot{width:10px;height:10px;border-radius:50%}
.rec.prob{color:var(--prob)} .rec.prob .dot{background:var(--prob);animation:blink 1.1s steps(2) infinite}
.rec.fixx{color:var(--fix)} .rec.fixx .dot{background:var(--fix)}
@keyframes blink{50%{opacity:.15}}
.pitchwrap{border-radius:14px;overflow:hidden;position:relative;
  border:1.5px solid color-mix(in srgb, var(--bc,#3ED6FF) 60%, transparent);
  background:
    radial-gradient(520px 220px at 50% -50px, color-mix(in srgb, var(--bc,#3ED6FF) 10%, transparent), transparent),
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
    var(--pitch);
  background-size:auto,32px 32px,32px 32px,auto;
  box-shadow:inset 0 0 70px rgba(0,0,0,.65)}
.pitchwrap svg{display:block;width:100%;height:auto}
.pitchwrap::after{content:'';position:absolute;left:0;right:0;top:-40%;height:34%;pointer-events:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb, var(--bc,#3ED6FF) 7%, transparent),transparent);
  animation:scan 5.5s linear infinite}
@keyframes scan{to{top:110%}}
.chip{transition:transform 1.1s cubic-bezier(.3,.7,.3,1)}
.chip circle{stroke-width:2.5}
.chip text{font-family:var(--body);font-weight:900;font-size:11px;fill:#08170F;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.chip.gk text{fill:#231a00}.chip.op text{fill:#2b0606}
.ballchip{transition:transform 1.1s cubic-bezier(.3,.7,.3,1)}
.ov{transition:opacity .6s ease;pointer-events:none}
.ovring circle{animation:ovpulse 1.6s ease-in-out infinite}
@keyframes ovpulse{0%,100%{stroke-opacity:.95}50%{stroke-opacity:.35}}
.caption{margin-top:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;
  font-weight:800;font-size:14.5px;min-height:52px;display:flex;align-items:center;gap:10px}
.caption .step{flex:none;font-family:var(--display);color:var(--bc,var(--gold));font-size:13px}
.bctrl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.playbtn,.stepbtn,.nextbtn{border:none;border-radius:999px;font-weight:900;font-size:13px;padding:11px 20px;display:inline-flex;align-items:center;gap:8px}
.playbtn{background:var(--bc,var(--gold));color:#05070C;box-shadow:0 0 14px color-mix(in srgb, var(--bc,var(--gold)) 40%, transparent)}
.stepbtn{background:var(--panel-2);border:1px solid var(--line);color:var(--chalk)}
.stepbtn:hover{border-color:var(--bc,var(--gold))}
.dots{display:flex;gap:7px;margin-left:auto}
.dot2{width:11px;height:11px;border-radius:50%;background:#1C2537;border:none;padding:0}
.dot2.on{background:var(--bc,var(--gold));box-shadow:0 0 10px color-mix(in srgb, var(--bc,var(--gold)) 65%, transparent)}
.legend{display:flex;gap:16px;margin-top:10px;font-size:11.5px;font-weight:900;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.nextbtn{margin-top:16px;background:var(--cc,var(--gold));color:#05070C;box-shadow:0 0 14px color-mix(in srgb, var(--cc,var(--gold)) 40%, transparent)}

/* verdict quiz */
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:12px;font-weight:900;color:var(--muted);letter-spacing:1px;text-transform:uppercase;gap:10px;flex-wrap:wrap}
.qprog{display:flex;gap:6px}
.qprog i{width:26px;height:6px;border-radius:99px;background:#1C2537}
.qprog i.done{background:var(--cc,var(--gold));box-shadow:0 0 8px color-mix(in srgb, var(--cc,var(--gold)) 55%, transparent)}
.qtext{font-size:clamp(16px,3vw,20px);font-weight:900;line-height:1.35;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:13px 15px;color:var(--chalk);
  font-weight:800;font-size:14.5px;transition:border-color .15s,transform .1s;display:flex;gap:12px;align-items:center}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:#0A0F1A;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--cc,var(--us));transform:translateX(4px)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--win);background:rgba(74,222,128,.12)} .opt.right .k{background:var(--win);color:#03240F}
.opt.wrong{border-color:var(--them);background:rgba(255,107,107,.10)} .opt.wrong .k{background:var(--them);color:#2b0606}
.opt.dim{opacity:.45}
.explain{margin-top:14px;border-radius:12px;padding:12px 15px;font-weight:800;font-size:14px;display:none;gap:10px;align-items:flex-start}
.explain.show{display:flex}
.explain.good{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.4)}
.explain.bad{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.4)}
.gainchip{display:inline-block;margin-right:8px;font-family:var(--display);font-size:12px;color:#05070C;background:var(--cc,var(--gold));border-radius:8px;padding:2px 8px}
.gainchip.zero{background:var(--them);color:#fff}
.nextq{margin-top:16px;border:none;border-radius:999px;padding:12px 26px;font-weight:900;font-size:14px;background:var(--cc,var(--gold));color:#05070C;display:none;
  box-shadow:0 0 14px color-mix(in srgb, var(--cc,var(--gold)) 40%, transparent)}
.nextq.show{display:inline-block}
.vdone{text-align:center;padding:14px 6px}
.vdone .big{font-size:46px;line-height:1}
.vdone h4{font-family:var(--display);font-size:19px;margin:8px 0 2px}
.vdone p{color:var(--muted);font-weight:800;font-size:13.5px}

/* evidence 5W cards */
.evintro{font-size:13.5px;font-weight:800;color:var(--muted);margin-bottom:14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.wcard{position:relative;min-height:120px;border-radius:14px;border:1.5px dashed color-mix(in srgb, var(--cc,#3ED6FF) 45%, transparent);
  background:rgba(0,0,0,.35);padding:14px;cursor:pointer;text-align:left;color:var(--chalk);transition:transform .15s ease,border-color .15s ease}
.wcard:hover{transform:translateY(-3px);border-color:var(--cc,#3ED6FF)}
.wcard .wtag{font-family:var(--display);font-size:16px;color:var(--cc,#3ED6FF);letter-spacing:1px}
.wcard .hint{font-size:11.5px;font-weight:900;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.wcard .tap{position:absolute;bottom:10px;right:12px;font-size:11px;font-weight:900;color:var(--gold);letter-spacing:1px}
.wcard .ans{display:none;font-weight:800;font-size:14px;margin-top:8px;line-height:1.45}
.wcard.open{border-style:solid;border-color:var(--cc,#3ED6FF);box-shadow:0 0 16px color-mix(in srgb, var(--cc,#3ED6FF) 25%, transparent)}
.wcard.open .ans{display:block}
.wcard.open .tap{display:none}

/* the fix */
.objective{margin-bottom:14px;border-radius:14px;padding:14px 16px;background:rgba(74,222,128,.08);border:1.5px solid rgba(74,222,128,.5);display:flex;gap:12px;align-items:flex-start}
.objective .mi{font-size:22px;line-height:1}
.objective b{display:block;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--fix);margin-bottom:3px}
.objective p{font-weight:900;font-size:15px}
.cuehead{margin-top:16px;font-size:13px;font-weight:900;color:var(--fix);letter-spacing:.3px}
.tasks{list-style:none;display:grid;gap:10px;margin-top:10px}
.tasks li{display:flex;gap:12px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;transition:border-color .15s}
.tasks li:hover{border-color:var(--fix)}
.tasks li.done{border-color:var(--fix);background:rgba(74,222,128,.07)}
.tasks .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;color:#03240F;background:#0A0F1A}
.tasks li.done .box{background:var(--fix);border-color:var(--fix)}
.tasks p{font-weight:800;font-size:14px}
.tasks p span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.lockedin{margin-top:14px;display:none;font-family:var(--display);font-size:13px;color:var(--fix);letter-spacing:.5px}
.lockedin.show{display:block}

/* positioning challenge */
.dgbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-2);border:1.5px solid var(--line);
  border-radius:12px;padding:10px 13px;margin-bottom:10px;font-weight:900;font-size:13px}
.dgbar.armed{border-color:var(--gold);background:rgba(255,201,60,.10);color:var(--gold)}
.dgbar .count{margin-left:auto;font-family:var(--display);font-size:12px;color:var(--muted)}
.dgcap{margin-top:8px;font-weight:800;font-size:13px;color:var(--muted);min-height:18px}
.dgctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.dgdots{display:flex;gap:6px;margin-left:auto;align-items:center}
.dgdots i{width:9px;height:9px;border-radius:99px;background:#2A3550;display:block;cursor:pointer}
.dgdots i.on{background:var(--gold);transform:scale(1.25)}
.dgdots i.freeze{box-shadow:0 0 0 2px rgba(255,201,60,.45)}
.dgroster{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dgpick{border:1.5px solid var(--line);background:var(--panel-2);color:var(--chalk);border-radius:999px;
  padding:8px 14px;font-weight:900;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.dgpick .tick{color:var(--win);font-size:12px}
.dgpick.sel{border-color:var(--gold);color:var(--gold);background:rgba(255,201,60,.12)}
.dgpick.moved{border-color:var(--win)}
.dgchip.sel circle{stroke:var(--gold);stroke-width:5}
.dgintro{font-size:14px;font-weight:900;margin-bottom:4px}
.dghelp{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:12px}
.dgboard svg{display:block;width:100%;height:auto;touch-action:none}
.dgchip{cursor:grab}
.dgchip.live circle{stroke:var(--gold);stroke-width:4}
.dgchip.live{animation:dgpulse 1.8s ease-in-out infinite}
@keyframes dgpulse{0%,100%{opacity:1}50%{opacity:.72}}
.dgtarget circle{fill:none;stroke:var(--win);stroke-width:2.5;stroke-dasharray:6 5}
.dgline{stroke:var(--win);stroke-width:2;stroke-dasharray:4 4;opacity:.8}
.dgscore{margin-top:12px;display:grid;gap:8px}
.dgrow{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-weight:800;font-size:13.5px}
.dgrow .pill{flex:none;min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#05070C;background:var(--us);padding:0 6px}
.dgrow .verd{margin-left:auto;font-family:var(--display);font-size:12px}
.dgrow.hit{border-color:var(--win)} .dgrow.hit .verd{color:var(--win)}
.dgrow.near{border-color:var(--gold)} .dgrow.near .verd{color:var(--gold)}
.dgrow.miss{border-color:var(--them)} .dgrow.miss .verd{color:var(--them)}

/* module reference */
.modref{margin-top:14px;border-radius:14px;padding:13px 15px;background:rgba(255,201,60,.07);border:1.5px solid rgba(255,201,60,.45);
  display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.modref .mi{font-size:20px;line-height:1}
.modref b{display:block;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.modref p{font-weight:900;font-size:14.5px}
.modref .go{margin-left:auto;align-self:center;text-decoration:none;background:var(--gold);color:#05070C;font-weight:900;font-size:12.5px;
  border-radius:999px;padding:9px 16px;white-space:nowrap}
.modref small{display:block;font-weight:800;font-size:12px;color:var(--muted);margin-top:3px}

.bonuschip{font-family:var(--display);font-size:10.5px;color:var(--gold);letter-spacing:.5px;margin-left:6px}
.finbonus{margin-top:10px;font-weight:900;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.finbonus.earned{color:var(--gold);font-family:var(--display);font-size:13.5px}
.subwin{margin-top:12px;border-radius:14px;padding:13px 15px;background:rgba(255,201,60,.09);border:1.5px solid rgba(255,201,60,.55);
  font-weight:900;font-size:13.5px;color:var(--gold)}
.subwin span{display:block;font-weight:800;font-size:12.5px;color:var(--chalk);margin-top:5px}
.subwin em{font-style:normal;color:var(--muted)}

/* submit your own */
.submit{margin-top:34px;border-radius:18px;padding:22px 20px;position:relative;overflow:hidden;
  background:radial-gradient(420px 170px at 20% 0%, rgba(79,195,247,.12), transparent 70%),var(--panel);
  border:1.5px solid rgba(79,195,247,.6);box-shadow:0 0 26px rgba(79,195,247,.14), inset 0 0 50px rgba(0,0,0,.55)}
.submit h2{font-family:var(--display);font-size:clamp(18px,3.4vw,24px);font-style:italic;color:var(--us)}
.submit .lead{font-weight:800;font-size:13.5px;color:var(--muted);margin-top:8px}
.sfield{margin-top:14px}
.sfield label{display:block;font-size:12.5px;font-weight:900;color:var(--chalk);margin-bottom:6px}
.sfield label i{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--muted);margin-top:2px}
.sfield textarea,.sfield input,.sfield select{width:100%;font-family:var(--body);font-weight:800;font-size:14px;color:var(--chalk);
  background:#0A0F1A;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;resize:vertical}
.sfield textarea{min-height:62px}
.sfield textarea:focus,.sfield input:focus,.sfield select:focus{border-color:var(--us);outline:none}
.subrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.subout{margin-top:14px;display:none}
.subout.show{display:block}
.subout .ok{font-family:var(--display);font-size:14px;color:var(--win);margin-bottom:8px}
.subcode{background:#0A0F1A;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11.5px;word-break:break-all;color:var(--us);max-height:150px;overflow:auto;user-select:all}
.subtext{background:#0A0F1A;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:800;font-size:13px;white-space:pre-wrap;margin-bottom:10px}

/* finish */
.finish{margin-top:34px;text-align:center;border-radius:18px;padding:26px 20px;position:relative;overflow:hidden;
  background:radial-gradient(420px 160px at 50% 0%, rgba(255,201,60,.12), transparent 70%),var(--panel);
  border:1.5px solid rgba(255,201,60,.7);box-shadow:0 0 26px rgba(255,201,60,.16), inset 0 0 50px rgba(0,0,0,.55)}
.finish h2{font-family:var(--display);font-size:clamp(19px,3.6vw,26px);font-style:italic;color:var(--gold);text-shadow:0 0 18px rgba(255,201,60,.4)}
.finish .stars{font-size:32px;letter-spacing:6px;color:var(--gold);margin:10px 0 2px}
.finish .tot{font-family:var(--display);font-size:22px;margin-top:6px}
.finish p{color:var(--muted);font-weight:800;font-size:13.5px;margin-top:6px}
.shname{max-width:360px;margin:14px auto 4px}
.shname input{width:100%;font-family:var(--body);font-weight:800;font-size:15px;color:var(--chalk);background:#0A0F1A;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.codebox{max-width:460px;margin:10px auto 0;background:#0A0F1A;border:1px solid var(--line);border-radius:12px;padding:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;color:var(--gold);user-select:all;min-height:44px}
.shrow{display:flex;gap:10px;margin-top:12px;justify-content:center;flex-wrap:wrap}

footer{max-width:940px;margin:0 auto;padding:26px 18px 40px;color:var(--muted);font-size:12px;font-weight:700;text-align:center}
footer button{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;font-weight:800}
footer button:hover{color:var(--them)}

.xppop{position:fixed;z-index:200;font-family:var(--display);color:var(--gold);font-size:22px;pointer-events:none;
  animation:pop 1.1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes pop{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.confetti{position:fixed;top:-14px;z-index:150;width:10px;height:16px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

@media (max-width:640px){
  .brand .t{font-size:12px}
  .tabs{width:calc(100% - 40px);justify-content:space-between}
  .tab{padding:9px 8px;font-size:11.5px;flex:1;justify-content:center}
  .cpts{position:static;display:inline-block;margin:10px 0 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

function ac(){
  if(muted) return null;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    return AC;
  }catch(e){ return null; }
}
async function loadSfx(name){
  if(SFX_BUFS[name]) return SFX_BUFS[name];
  const c=ac(); if(!c) return null;
  try{
    const bin=atob(SFX_B64[name]);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    SFX_BUFS[name]=await c.decodeAudioData(arr.buffer);
    return SFX_BUFS[name];
  }catch(e){ return null; }
}
async function playSfx(name,vol){

  try{
    const s=c.createBufferSource(); s.buffer=buf;
    const g=c.createGain(); g.gain.value=vol||0.5;
    s.connect(g).connect(c.destination); s.start();
  }catch(e){}
}
function beep(o){
  const c=ac(); if(!c) return;
  const f=o.f||880,t=o.t||0.15,type=o.type||"sine",g=o.g||0.12,slide=o.slide||0,when=o.when||0;
  try{
    const osc=c.createOscillator(),v=c.createGain(),t0=c.currentTime+when;
    osc.type=type;
    osc.frequency.setValueAtTime(f,t0);
    if(slide) osc.frequency.linearRampToValueAtTime(f+slide,t0+t);
    v.gain.setValueAtTime(0.0001,t0);
    v.gain.linearRampToValueAtTime(g,t0+0.015);
    v.gain.exponentialRampToValueAtTime(0.0001,t0+t);
    osc.connect(v).connect(c.destination);
    osc.start(t0); osc.stop(t0+t+0.05);
  }catch(e){}
}

function chipSVG(ent,pos){
  const [x,y]=pos||[310,200];

    return `<g class="ballchip" data-id="${esc(ent.id)}" style="transform:translate(${x}px,${y}px)">
      <circle r="7.5" fill="#F6F6F2" stroke="#101820" stroke-width="2"/>

  const stroke=ent.t==="op"?"#FFD5D5":(ent.t==="gk"?"#FFE9B0":"#DFF6FF");
  return `<g class="${cls}" data-id="${esc(ent.id)}" style="transform:translate(${x}px,${y}px)">
    <circle r="13" fill="${fill}" stroke="${stroke}"/><text>${esc(ent.n||"")}</text></g>`;
}
function arrowHead(x1,y1,x2,y2){
  const a=Math.atan2(y2-y1,x2-x1),L=10;
  const p1=(x2-L*Math.cos(a-.4))+","+(y2-L*Math.sin(a-.4));
  const p2=(x2-L*Math.cos(a+.4))+","+(y2-L*Math.sin(a+.4));
  return `${x2},${y2} ${p1} ${p2}`;
}
function ovSVG(ov){
  const k=ov.kind;
  if(k==="lane")return `<g class="ov" data-ov="${esc(ov.id)}"><line x1="${ov.x1}" y1="${ov.y1}" x2="${ov.x2}" y2="${ov.y2}" stroke="var(--gold)" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/><polygon points="${arrowHead(ov.x1,ov.y1,ov.x2,ov.y2)}" fill="var(--gold)"/></g>`;
  if(k==="arrow")return `<g class="ov" data-ov="${esc(ov.id)}"><line x1="${ov.x1}" y1="${ov.y1}" x2="${ov.x2}" y2="${ov.y2}" stroke="var(--us)" stroke-width="3.5" stroke-linecap="round"/><polygon points="${arrowHead(ov.x1,ov.y1,ov.x2,ov.y2)}" fill="var(--us)"/></g>`;
  if(k==="arrowred")return `<g class="ov" data-ov="${esc(ov.id)}"><line x1="${ov.x1}" y1="${ov.y1}" x2="${ov.x2}" y2="${ov.y2}" stroke="var(--them)" stroke-width="3.5" stroke-linecap="round"/><polygon points="${arrowHead(ov.x1,ov.y1,ov.x2,ov.y2)}" fill="var(--them)"/></g>`;
  if(k==="ring")return `<g class="ov ovring" data-ov="${esc(ov.id)}"><circle cx="${ov.x}" cy="${ov.y}" r="22" fill="none" stroke="var(--gold)" stroke-width="3"/></g>`;
  if(k==="cross")return `<g class="ov" data-ov="${esc(ov.id)}"><line x1="${ov.x-15}" y1="${ov.y-15}" x2="${ov.x+15}" y2="${ov.y+15}" stroke="var(--them)" stroke-width="5" stroke-linecap="round"/><line x1="${ov.x+15}" y1="${ov.y-15}" x2="${ov.x-15}" y2="${ov.y+15}" stroke="var(--them)" stroke-width="5" stroke-linecap="round"/></g>`;
  if(k==="zone")return `<g class="ov" data-ov="${esc(ov.id)}"><rect x="${Math.min(ov.x1,ov.x2)}" y="${Math.min(ov.y1,ov.y2)}" width="${Math.abs(ov.x2-ov.x1)}" height="${Math.abs(ov.y2-ov.y1)}" rx="8" fill="rgba(255,201,60,.10)" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 6"/></g>`;
  if(k==="label")return `<g class="ov" data-ov="${esc(ov.id)}"><rect x="${ov.x-64}" y="${ov.y-14}" width="128" height="26" rx="13" fill="rgba(0,0,0,.72)" stroke="var(--gold)"/><text x="${ov.x}" y="${ov.y+1}" text-anchor="middle" dominant-baseline="central" fill="var(--gold)" font-size="11" font-weight="900" font-family="Nunito,sans-serif">${esc(ov.text||"")}</text></g>`;
  return "";
}
function ovVisible(ov,frameIdx){
  const f=frameIdx+1;
  const on=ov.on==null?1:ov.on;
  return f>=on && (ov.off==null||f<ov.off);
}

// ---------- positioning challenge ----------
function CSSesc(s){return String(s).replace(/["\\]/g,"\\$&");}
function DragBoard(root,p,pi){
  const a=p.animProblem, tg=p.drag.targets, ids=Object.keys(tg);
  const freeze=Math.max(0,Math.min((a.frames||[{}]).length-1,(p.drag.step||1)-1));
  const done=state.drag[pi], reveal=!!done;
  const placed=Object.assign({},(done&&done.pos)||{});
  root._placed=placed;
  let view=reveal?freeze:0, sel=null, timer=null;

  root.innerHTML=`
    <div class="dgbar"></div>
    <div class="pitchwrap" style="--bc:#FFC93C"><svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="dgcap"></div>
    <div class="dgctrl">
      <button class="stepbtn dgplay">&#9654; Watch the lead-up</button>
      <button class="stepbtn dgback">&lsaquo;</button>
      <button class="stepbtn dgfwd">&rsaquo;</button>
      <span class="dgdots"></span>
    </div>
    <div class="dgroster"></div>`;
  const svg=root.querySelector("svg"), bar=root.querySelector(".dgbar"),
        cap=root.querySelector(".dgcap"), dots=root.querySelector(".dgdots"),
        roster=root.querySelector(".dgroster");
  const nameOf=id=>{const e=(a.ents||[]).find(x=>x.id===id);return (e&&e.n)||id;};
  const atFreeze=()=>view===freeze;

  function posFor(id,fi){
    if(fi===freeze&&placed[id])return placed[id];
    const f=a.frames[fi]||{p:{}};
    return f.p[id]||[310,200];
  }
  function draw(){
    const fi=view, f=a.frames[fi]||{p:{}};
    const ovs=(a.overlays||[]).filter(o=>{const n=fi+1,on=o.on==null?1:o.on;return n>=on&&(o.off==null||n<o.off);}).map(ovSVG).join("");
    const targets=reveal?ids.map(id=>`<g class="dgtarget"><circle cx="${tg[id][0]}" cy="${tg[id][1]}" r="15"/></g>`+
      `<line class="dgline" x1="${posFor(id,freeze)[0]}" y1="${posFor(id,freeze)[1]}" x2="${tg[id][0]}" y2="${tg[id][1]}"/>`).join(""):"";
    const chips=(a.ents||[]).filter(e=>e.t!=="ball").map(e=>{
      let s=chipSVG(e,posFor(e.id,fi));
      if(tg[e.id]&&!reveal&&atFreeze())s=s.replace('class="chip','class="chip dgchip live'+(sel===e.id?" sel":""));
      return s;}).join("");
    const ball=(a.ents||[]).filter(e=>e.t==="ball").map(e=>chipSVG(e,posFor(e.id,fi))).join("");
    svg.innerHTML=pitchSVG(ovs+targets+chips+ball);
    cap.textContent=f.c||"";
    dots.innerHTML=a.frames.slice(0,freeze+1).map((_,i)=>
      `<i class="${i===view?"on":""} ${i===freeze?"freeze":""}" data-i="${i}"></i>`).join("");
    drawBar();drawRoster();
  }
  function drawBar(){
    const n=ids.filter(id=>placed[id]).length;
    if(reveal){bar.className="dgbar";bar.innerHTML="<span>\u2705 Answer locked in \u2014 the green rings show where coach wanted them.</span>";return;}
    if(!atFreeze()){bar.className="dgbar";
      bar.innerHTML=`<span>\u25b6 Step ${view+1} of the lead-up \u2014 play on to step ${freeze+1} to make your call.</span>`;return;}
    bar.className="dgbar"+(sel?" armed":"");
    bar.innerHTML=(sel
      ? `<span>\u261d\ufe0f Now tap where <b>${esc(nameOf(sel))}</b> should be</span>`
      : "<span>Tap a gold-ringed player to move them</span>")
      +`<span class="count">${n}/${ids.length} placed</span>`;
  }
  function drawRoster(){
    if(reveal||!atFreeze()){roster.innerHTML="";return;}
    roster.innerHTML=ids.map(id=>`<button class="dgpick ${sel===id?"sel":""} ${placed[id]?"moved":""}" data-id="${esc(id)}">`+
      `${esc(nameOf(id))}${placed[id]?'<span class="tick">\u2713</span>':""}</button>`).join("");
  }
  function stop(){if(timer){clearInterval(timer);timer=null;const b=root.querySelector(".dgplay");if(b)b.innerHTML="&#9654; Watch the lead-up";}}
  function show(i){view=Math.max(0,Math.min(freeze,i));if(!atFreeze())sel=null;draw();}

  root.querySelector(".dgplay").addEventListener("click",()=>{
    if(timer){stop();return;}
    if(freeze===0){show(0);return;}
    show(0);sfxWhistle();
    root.querySelector(".dgplay").innerHTML="&#10074;&#10074; Pause";
    timer=setInterval(()=>{ if(view>=freeze){stop();return;} show(view+1); sfxKick(); },1500);
  });
  root.querySelector(".dgback").addEventListener("click",()=>{stop();show(view-1);sfxKick();});
  root.querySelector(".dgfwd").addEventListener("click",()=>{stop();show(view+1);sfxKick();});
  dots.addEventListener("click",e=>{const i=e.target.dataset.i;if(i!=null){stop();show(+i);}});
  roster.addEventListener("click",e=>{
    const b=e.target.closest(".dgpick");if(!b)return;
    sel=(sel===b.dataset.id)?null:b.dataset.id;sfxClick();draw();
  });
  if(reveal){draw();return;}

  function pt(evt){
    const q=svg.createSVGPoint();q.x=evt.clientX;q.y=evt.clientY;
    const m=svg.getScreenCTM();if(!m)return null;
    const r=q.matrixTransform(m.inverse());
    return [Math.round(Math.max(4,Math.min(616,r.x))),Math.round(Math.max(4,Math.min(396,r.y)))];
  }
  let drag=null,moved=false;
  svg.addEventListener("pointerdown",ev=>{
    if(!atFreeze())return;
    const g=ev.target.closest("[data-id]");
    if(g&&tg[g.dataset.id]){
      sel=g.dataset.id;drag={id:sel};moved=false;
      try{svg.setPointerCapture(ev.pointerId);}catch(e){}
      ev.preventDefault();draw();return;
    }
    if(sel){const q=pt(ev);if(q){placed[sel]=q;sfxKick();sel=null;draw();}}
  });
  svg.addEventListener("pointermove",ev=>{
    if(!drag)return;
    const q=pt(ev);if(!q)return;
    moved=true;placed[drag.id]=q;
    const g=svg.querySelector('[data-id="'+CSSesc(drag.id)+'"]');
    if(g)g.setAttribute("transform","translate("+q[0]+","+q[1]+")");
  });
  const end=()=>{
    if(!drag)return;
    drag=null;
    if(moved)sel=null;
    draw();
  };
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  draw();
}

// ---------- quiz builders ----------
function seededShuffle(arr,seed){
  const a=arr.slice();let s=seed;
  for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function buildQuiz(prob,pi){
  const qs=[];
  const cfg=DATA.config||{};
  const moments=cfg.moments||[];
  if(cfg.autoMomentQuiz!==false && prob.moment){
    const mi=moments.findIndex(m=>m.id===prob.moment);
    if(mi>=0)qs.push({q:"Which moment of the game did this happen in?",o:moments.map(m=>m.label),a:mi,
      e:"This was a "+moments[mi].label.toLowerCase()+" moment — spotting the moment is the first step of fixing any football problem."});
  }
  if(cfg.autoPrincipleQuiz!==false && prob.principle){
    const pool=((cfg.principlesByMoment||{})[prob.moment]||[]).filter(p=>p!==prob.principle);
    if(pool.length>=2){
      const opts=seededShuffle([prob.principle].concat(seededShuffle(pool,pi+7).slice(0,3)),pi+13);
      qs.push({q:"Which of our team rules broke down here?",o:opts,a:opts.indexOf(prob.principle),
        e:(prob.w&&prob.w.why)?prob.w.why:"That's the principle this problem attacked."});
    }
  }
  (prob.quiz||[]).forEach(q=>{if(q&&q.q&&q.o&&q.o.length>=2)qs.push(q);});
  return qs;
}

// ---------- analyst bonus (submitting your own problem) ----------
function subPts(){
  const s=(DATA.config&&DATA.config.submit)||{};
  const q=s.pts||{};
  return {base:q.base==null?120:+q.base, full:q.full==null?80:+q.full};
}
function gradeSub(v){
  const len=k=>String(v[k]||"").trim().length;
  const base=len("title")>=3 && len("what")>=15 && len("idea")>=10;
  const ws=["what","who","where","when","why"];
  const moms=(DATA.config&&DATA.config.moments)||[];
  const full=base && ws.every(k=>len(k)>=8) && (!moms.length||String(v.moment||"").trim().length>0);
  const miss=[];
  if(!base){
    if(len("title")<3)miss.push("give it a name");
    if(len("what")<15)miss.push("describe what actually happened");
    if(len("idea")<10)miss.push("say what we should do next time");
  }else if(!full){
    ws.forEach(k=>{if(len(k)<8)miss.push(k.toUpperCase());});
    if(moms.length&&!String(v.moment||"").trim())miss.push("which moment");
  }
  return {base:base,full:full,miss:miss};
}
function bonusPts(){const a=state.subAward;return a?((a.base||0)+(a.full||0)):0;}

// ---------- points ----------
function maxPts(){
  let m=0;
  DATA.problems.forEach((p,pi)=>{m+=buildQuiz(p,pi).length*PTS_Q; if(dragOn(p))m+=PTS_DRAG; if((p.fix&&p.fix.tasks||[]).length)m+=PTS_TASKS;});
  return m;
}
function curPts(){
  let t=0;
  DATA.problems.forEach((p,pi)=>{
    buildQuiz(p,pi).forEach((q,qi)=>{const a=state.ans[pi+"-"+qi];if(a&&a.correct)t+=PTS_Q;});
    if(dragOn(p)&&state.drag[pi])t+=(state.drag[pi].pts||0);
    const tasks=(p.fix&&p.fix.tasks)||[];
    if(tasks.length&&tasks.every((_,ti)=>state.tasks[pi+"-"+ti]))t+=PTS_TASKS;
  });
  return t;
}
function grandTotal(){return curPts()+bonusPts();}
function refreshScore(){
  const b=bonusPts();

    (b?` <b class="bonuschip">\uff0b${fmt(b)} BONUS</b>`:"");
  DATA.problems.forEach((p,pi)=>{
    const el=document.getElementById("cpts-"+pi);if(!el)return;

    buildQuiz(p,pi).forEach((q,qi)=>{m+=PTS_Q;const a=state.ans[pi+"-"+qi];if(a&&a.correct)t+=PTS_Q;});
    if(dragOn(p)){m+=PTS_DRAG;if(state.drag[pi])t+=(state.drag[pi].pts||0);}
    const tasks=(p.fix&&p.fix.tasks)||[];

}

// ---------- render ----------
function dragOn(p){return !!(p.drag&&p.drag.on&&p.drag.targets&&Object.keys(p.drag.targets).length);}
function dragFrame(p){
  const a=p.animProblem||{frames:[{p:{}}],ents:[]};
  const i=Math.max(0,Math.min((a.frames||[{}]).length-1,(p.drag.step||1)-1));
  return a.frames[i]||{p:{}};
}
function dragScore(p,placed){
  const tg=p.drag.targets,ids=Object.keys(tg),tol=p.drag.tol||45;
  const share=PTS_DRAG/ids.length;
  let pts=0;const rows=[];
  ids.forEach(id=>{
    const got=placed[id]||dragFrame(p).p[id]||[310,200];
    const d=Math.hypot(got[0]-tg[id][0],got[1]-tg[id][1]);
    let band="miss",got_=0;
    if(d<=tol){band="hit";got_=share;}
    else if(d<=tol*2){band="near";got_=share/2;}
    pts+=got_;rows.push({id:id,band:band,pts:Math.round(got_)});
  });
  return {pts:Math.round(pts),rows:rows};
}
function moduleRef(p){
  if(!p.module)return "";
  const url=p.moduleUrl||((DATA.config&&DATA.config.portalUrl)||"");
  return `<div class="modref"><span class="mi">📚</span><div><b>Revise this in the Academy</b><p>${esc(p.module)}</p>
    <small>Same idea, drilled step by step — go back over it before next game.</small></div>
    ${url?`<a class="go" href="${esc(url)}" target="_blank" rel="noopener">Open module →</a>`:""}</div>`;
}

function gotoStep(pi,step){
  const sec=document.getElementById("case-"+pi);
  sec.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.step===step));
  sec.querySelectorAll(".pstep").forEach(s=>s.hidden=s.dataset.step!==step);
}

function renderQuiz(pi){
  const host=document.getElementById("qhost-"+pi);if(!host)return;
  const qs=buildQuiz(DATA.problems[pi],pi);
  let qi=0;
  while(qi<qs.length&&state.ans[pi+"-"+qi])qi++;
  qs.forEach((_,i)=>{const el=document.getElementById("qp-"+pi+"-"+i);if(el)el.classList.toggle("done",!!state.ans[pi+"-"+i]);});
  if(qi>=qs.length){
    const c=qs.filter((_,i)=>state.ans[pi+"-"+i]&&state.ans[pi+"-"+i].correct).length;
    if(!state.ans["done-"+pi]){state.ans["done-"+pi]=1;saveState();sfxFanfare();}
    host.innerHTML=`<div class="vdone"><div class="big">${c===qs.length?"🏅":"⚖️"}</div>
      <h4>VERDICT DELIVERED</h4><p>${c}/${qs.length} correct · ${dragOn(DATA.problems[pi])?"now show us where we should have been 🎯":"now open the evidence 🔎"}</p>
      <button class="nextbtn" id="v2e-${pi}">${dragOn(DATA.problems[pi])?"Take the positioning challenge →":"Open the evidence →"}</button></div>`;
    document.getElementById("v2e-"+pi).addEventListener("click",()=>{sfxClick();gotoStep(pi,dragOn(DATA.problems[pi])?"yourcall":"evidence");});
    return;
  }
  const q=qs[qi];
  host.innerHTML=`<div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.o.map((o,oi)=>`<button class="opt" data-oi="${oi}"><span class="k">${"ABCD"[oi]||oi+1}</span>${esc(o)}</button>`).join("")}</div>
    <div class="explain" id="qex-${pi}"></div>
    <button class="nextq" id="qnext-${pi}">Next →</button>`;
  host.querySelectorAll(".opt").forEach(btn=>btn.addEventListener("click",e=>{
    const oi=+btn.dataset.oi, good=oi===q.a;
    host.querySelectorAll(".opt").forEach(b=>{b.disabled=true;
      if(+b.dataset.oi===q.a)b.classList.add("right");
      else if(+b.dataset.oi===oi)b.classList.add("wrong");
      else b.classList.add("dim");});
    const ex=document.getElementById("qex-"+pi);
    ex.className="explain show "+(good?"good":"bad");
    ex.innerHTML=`<span class="gainchip${good?"":" zero"}">${good?"+"+PTS_Q:"+0"}</span><span>${esc(q.e||"")}</span>`;
    state.ans[pi+"-"+qi]={correct:good};saveState();
    if(good){streak++;sfxCorrect(streak);}else{streak=0;sfxWrong();}
    if(good){const r=btn.getBoundingClientRect();xppop(r.left+r.width/2,r.top,"+"+PTS_Q);}
    document.getElementById("qnext-"+pi).classList.add("show");
    refreshScore();
  }));
  document.getElementById("qnext-"+pi).addEventListener("click",()=>renderQuiz(pi));
}

// ---------- finish / score code ----------
let celebrated=false;
function renderFinishState(){
  const t=curPts(),m=maxPts();
  const pct=m?t/m:0;
  const stars=pct>=0.99?"★★★":pct>=0.7?"★★☆":pct>=0.4?"★☆☆":"☆☆☆";
  document.getElementById("finStars").textContent=stars;
  document.getElementById("finTot").textContent=fmt(t)+" / "+fmt(m)+" PTS";
  const bEl=document.getElementById("finBonus"),b=bonusPts();
  if(bEl){
    bEl.innerHTML=b?`\ud83d\udd75\ufe0f ANALYST BONUS \uff0b${fmt(b)} PTS \u00b7 grand total ${fmt(t+b)}`:
      `\ud83d\udd75\ufe0f Send coach a problem you spotted \u2014 worth up to \uff0b${fmt(subPts().base+subPts().full)} bonus points`;
    bEl.classList.toggle("earned",!!b);
  }
  const done=DATA.problems.every((p,pi)=>buildQuiz(p,pi).every((_,qi)=>state.ans[pi+"-"+qi]));
  document.getElementById("finMsg").textContent=done?
    (pct>=0.99?"Perfect debrief. You'll spot it a mile off next time. 🧠":"Debrief done — generate your code and send it to coach."):
    "Work through both case files to fill your scorecard.";
  if(done&&pct>=0.7&&!celebrated){celebrated=true;confetti();sfxRoar();}
}
function mdrHash(s){let h=5381;s=s+"MDR-"+slug;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return ("0000"+h.toString(36)).slice(-4);}
function genCode(){
  const nm=String(document.getElementById("shName").value||"").trim().replace(/\s+/g,"_").replace(/[^\w\u00C0-\u024F-]/g,"").slice(0,14).toUpperCase()||"PLAYER";
  const body="MDR-"+slug.toUpperCase()+"-"+nm+"-"+grandTotal();
  document.getElementById("shCode").textContent=body+"-"+mdrHash(body);
}

// ---------- reset ----------
document.getElementById("resetBtn").addEventListener("click",()=>{
  if(!confirm("Reset your progress for this debrief?"))return;
  state={ans:{},tasks:{},ws:{},drag:{},player:state.player,muted:muted,sub:state.sub,subAward:state.subAward};saveState();celebrated=false;render();
});

// ---------- go ----------
loadState();
muted=!!state.muted;syncMute();
if(DATA&&DATA.meta){render();}
else{document.getElementById("main").innerHTML="<p style='padding:40px;text-align:center;font-weight:800;color:var(--muted)'>No debrief data found. Export this page from the Match Review editor.</p>";}
/*JS-END*/
</script>
